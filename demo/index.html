<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>indo-g2p — Indonesian text to IPA phonemes</title>
    <meta
      name="description"
      content="Convert Indonesian text to IPA phonemes and syllables in the browser. Zero dependencies, no network calls."
    />
    <link rel="canonical" href="https://snowfluke.github.io/indo-g2p/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="indo-g2p" />
    <meta property="og:title" content="indo-g2p — Indonesian text to IPA phonemes" />
    <meta
      property="og:description"
      content="Convert Indonesian text to IPA phonemes and syllables in the browser. Zero dependencies, no network calls."
    />
    <meta property="og:url" content="https://snowfluke.github.io/indo-g2p/" />
    <meta property="og:image" content="https://snowfluke.github.io/indo-g2p/banner.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="indo-g2p: Saya pergi ke sekolah becomes saja pərgi kə səkolah"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>indo-g2p</h1>
        <p>Indonesian text to IPA phonemes, in the browser. No network calls.</p>
      </header>

      <label class="field">
        <span>Indonesian text</span>
        <textarea id="input" rows="3" spellcheck="false">
Tak seorang pun boleh ditangkap, ditahan atau dibuang dengan sewenang-wenang.</textarea>
      </label>

      <div class="samples" id="samples"></div>

      <div class="options">
        <label>
          <input type="checkbox" id="expandAbbr" />
          <span>Spell out abbreviations <code>tv</code> to <code>téfé</code></span>
        </label>
        <label>
          <input type="checkbox" id="homographs" />
          <span>Resolve homographs <em>(loads a 3.3 MB tagger)</em></span>
        </label>
      </div>

      <section class="out">
        <h2>Phonemes</h2>
        <output id="phonemes" class="big"></output>
      </section>

      <section class="out">
        <h2>Syllables</h2>
        <output id="syllables" class="chips"></output>
      </section>

      <section class="out">
        <h2>Back to spelling</h2>
        <output id="grapheme"></output>
      </section>

      <p class="timing" id="timing"></p>

      <footer>
        <a href="https://github.com/snowfluke/indo-g2p">GitHub</a>
        <a href="https://www.npmjs.com/package/indo-g2p">npm</a>
        <a href="https://jsr.io/@snowfluke/indo-g2p">JSR</a>
      </footer>
    </main>

    <script type="module" src="./demo.ts"></script>
  </body>
</html>
