name: Deploy demo to GitHub Pages

# Publishes demo/ as a static site. Enable it once under
# Settings > Pages > Source: GitHub Actions; no gh-pages branch is involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Queue rather than cancel, so a run that is already
# uploading is never killed halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Bun emits relative asset paths, so the same output works at the repo
      # subpath a project site is served from.
      - name: Build the demo
        run: bun run build:site

      # Without this a visitor deep-linking any path gets the 404 page.
      - name: Add SPA fallback and disable Jekyll
        run: |
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish to Pages
      id-token: write # verify the deployment came from this workflow
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
