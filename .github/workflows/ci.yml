name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Quality Checks and Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        # Frozen so install never rewrites bun.lock; a dirty tree makes the
        # jsr dry run abort on uncommitted changes.
        run: bun install --frozen-lockfile

      # Block the merge on any known advisory in a dependency. The published
      # package has no runtime dependencies, so this gates the toolchain.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      # Includes the 886 recorded parity fixtures, which are the contract with
      # the upstream Python implementation.
      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      # Catches slow types and missing exports before a release tries to.
      - name: JSR publish dry run
        run: bunx jsr publish --dry-run --allow-dirty

      # The generated modules under src/data/ must match their generator and
      # the curated table, or a hand-edit has silently changed pronunciations.
      - name: Verify generated data is reproducible
        run: |
          python3 scripts/dump-pos.py .
          git diff --exit-code -- src/data/homographs.ts src/data/collocations.ts

      # The README's coverage matrix is produced by running the library. Three
      # hand-written examples in it were wrong before a review caught them, so
      # it is generated and the build fails if the checked-in copy has drifted.
      - name: Verify the coverage matrix matches reality
        run: |
          bun run coverage
          git diff --exit-code -- README.md
