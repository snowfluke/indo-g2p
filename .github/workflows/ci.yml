name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Quality Checks and Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        # Frozen so install never rewrites bun.lock; a dirty tree makes the
        # jsr dry run abort on uncommitted changes.
        run: bun install --frozen-lockfile

      # Block the merge on any known advisory in a dependency. The published
      # package has no runtime dependencies, so this gates the toolchain.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      # Includes the 886 recorded parity fixtures, which are the contract with
      # the upstream Python implementation.
      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      # Catches slow types and missing exports before a release tries to.
      - name: JSR publish dry run
        run: bunx jsr publish --dry-run --allow-dirty

      # The generated modules under src/data/ must match their generator and
      # the curated table, or a hand-edit has silently changed pronunciations.
      - name: Verify generated data is reproducible
        run: |
          python3 scripts/dump-pos.py .
          git diff --exit-code -- src/data/homographs.ts
