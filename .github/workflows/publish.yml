name: Publish

on:
  release:
    types: [published]
  # Manual trigger for re-publishing, e.g. when jsr fell behind npm. The npm
  # step skips versions already published and the release-asset steps are
  # skipped when there is no release context.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM and signature to the GitHub release
      id-token: write # npm provenance + jsr OIDC
      attestations: write # build provenance for the release tarball
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 to do the OIDC exchange. Node 24
      # currently bundles a new enough npm, but the bundled version moves on
      # its own, and a silent downgrade would publish without an attestation.
      # Pinned rather than `latest` so a release is reproducible and Scorecard's
      # Pinned-Dependencies check passes.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12.0.2
          npm --version

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mirrors the gate that runs on every pull request. A release should
      # never ship something CI would have rejected.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      - name: Run tests
        run: bun test

      - name: Publish package to jsr
        run: bunx jsr publish

      - name: Build
        run: bun run build

      # --provenance is implied by OIDC trusted publishing, but passing it
      # explicitly makes a misconfigured publisher fail loudly instead of
      # silently shipping without an attestation.
      - name: Publish to npm
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "indo-g2p@$ver" version >/dev/null 2>&1; then
            echo "indo-g2p@$ver already published to npm, skipping."
          else
            npm publish --access=public --provenance
          fi

      # A CycloneDX SBOM per release, so consumers can audit each version's
      # dependency set without cloning.
      - name: Generate and attach SBOM
        if: github.event_name == 'release'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: indo-g2p-sbom.cyclonedx.json
          output-file: indo-g2p-sbom.cyclonedx.json
          upload-release-assets: true

      # Pack the exact published tarball so it can be signed and attached.
      # OpenSSF Scorecard's Signed-Releases check reads release assets for a
      # signature; npm provenance alone is not visible to it.
      - name: Pack published tarball
        if: github.event_name == 'release'
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # Scorecard's Signed-Releases check wants provenance alongside the
      # signature. This attests the exact tarball that was published and
      # attaches the bundle as .intoto.jsonl, which is the name it looks for.
      - name: Attest the published tarball
        if: github.event_name == 'release'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/*.tgz

      - name: Name the attestation for the release
        if: github.event_name == 'release'
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "$RUNNER_TEMP/indo-g2p-$(node -p "require('./package.json').version").intoto.jsonl"

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via OIDC (Sigstore/Fulcio). No long-lived keys; uses
      # the id-token: write permission. cosign 3.x emits one .sigstore.json
      # bundle holding the signature, Fulcio cert, and Rekor entry.
      - name: Sign the tarball (keyless)
        if: github.event_name == 'release'
        env:
          COSIGN_YES: "true"
        run: |
          for f in "$RUNNER_TEMP"/*.tgz; do
            cosign sign-blob --bundle "$f.sigstore.json" "$f"
          done

      - name: Attach tarball and signature to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP"/*.sigstore.json \
            "$RUNNER_TEMP"/*.intoto.jsonl --clobber
