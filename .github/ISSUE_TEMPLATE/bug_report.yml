name: Bug report
description: Something crashes, hangs, or behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest snippet that shows the problem.
      render: typescript
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Bun 1.3.14 on macOS 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: indo-g2p version
      placeholder: 0.1.0
    validations:
      required: true
